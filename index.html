<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>杭州大富翁 · 2010—2026</title>
<meta name="description" content="以 2010—2026 杭州楼市为背景的回合制地产经营游戏。一回合一个月，四章十六年，买地、加杠杆、扛调控。">
<style>
  :root{
    --paper:#F5F0E6; --ink:#2A2420; --ink-soft:#6B6156;
    --teal:#2E7D6F; --gold:#C9A227; --line:#D8CDBB;
    --red:#B3261E; --green:#1B7A3E;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:var(--paper); color:var(--ink);
    min-height:100%;
    display:flex; justify-content:center; padding:14px 12px; overflow-x:hidden;
  }
  #app{width:100%;max-width:430px;display:flex;flex-direction:column;gap:7px}
  /* 竖屏靠页面滚动承载高度，任何区块都不允许被 flex 压扁 */
  #app > *{flex:0 0 auto}

  /* HUD */
  #hud{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:0 2px 0 var(--line)}
  .hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  #date{font-size:15px;font-weight:800;letter-spacing:.5px}
  #chapter{font-size:9.5px;color:var(--ink-soft);margin-top:1px}
  .badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:5px;background:#EFE9DC;color:var(--ink-soft)}
  #turnInfo{font-size:10.5px;color:var(--ink-soft);text-align:right;white-space:nowrap}
  #bar-progress{height:4px;background:#EFE9DC;border-radius:2px;margin:7px 0 6px;overflow:hidden}
  #bar-fill{height:100%;width:0;background:var(--teal);border-radius:2px;transition:width .3s}

  .players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
  .pcard{display:flex;flex-direction:column;gap:3px;padding:5px 7px;border-radius:8px;min-width:0;
         background:#FAF7F0;border:1.5px solid transparent;font-size:11px;line-height:1.2}
  .phead{display:flex;align-items:center;gap:4px;min-width:0}
  /* 现金 / 负债 / 房产 / 持股 四项分列，标签左、数值右 */
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px 8px;font-size:9px;line-height:1.4}
  .pkv{display:flex;justify-content:space-between;gap:3px;min-width:0}
  .pkv i{font-style:normal;color:var(--ink-soft);flex:0 0 auto}
  .pkv b{font-weight:700;font-variant-numeric:tabular-nums;overflow:hidden;
         text-overflow:ellipsis;white-space:nowrap}
  .pkv b.neg{color:var(--red)}
  .pkv b.muted{color:#B5A99A;font-weight:400}
  .pcard.active{border-color:var(--gold);background:#FFF9E6}
  .pcard.dead{opacity:.35}
  .pcard.dead .pname{text-decoration:line-through}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .pname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .prank{width:15px;height:15px;flex:0 0 auto;border-radius:5px;display:flex;align-items:center;
         justify-content:center;font-size:9px;font-weight:800;background:#EFE9DC;color:#8A7F70;
         font-variant-numeric:tabular-nums}
  .prank.r1{background:#F2D27A;color:#5A4300}
  .prank.r2{background:#DCDCDC;color:#4A4A4A}
  .prank.r3{background:#E0B48A;color:#5A3410}

  /* 证券 K 线 */
  #kline{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px 6px;
         box-shadow:0 2px 0 var(--line)}
  .k-head{display:flex;align-items:baseline;gap:6px;min-width:0}
  .k-name{font-size:11px;font-weight:700}
  .k-price{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;margin-left:auto}
  .k-chg{font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
  .k-chg.up{color:var(--red)}
  .k-chg.down{color:var(--green)}
  #kchart{display:block;width:100%;height:92px;margin-top:3px}
  .k-foot{display:flex;gap:8px;font-size:9.5px;color:var(--ink-soft);margin-top:3px;
          font-variant-numeric:tabular-nums;flex-wrap:wrap}
  .k-foot span:last-child{margin-left:auto}
  .k-foot .up{color:var(--red);font-weight:700}
  .k-foot .down{color:var(--green);font-weight:700}

  #policy{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .chip{font-size:9px;padding:2px 6px;border-radius:6px;background:#FDE7E4;color:var(--red);font-weight:700;cursor:pointer}
  .chip.info{background:#E6F0EC;color:var(--teal)}
  #legacy{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;min-height:11px}
  .chip.legacy{background:#EDE7DC;color:#6B6156}
  .chip.legacy:hover{background:#E2D9C8}
  .chip.legacy.empty{opacity:.6;background:#F2EDE3}

  /* 棋盘 */
  #boardWrap{position:relative;width:100%;aspect-ratio:1/1;
             min-width:240px;min-height:240px;flex:0 0 auto;
             background:#fff;
             border:2px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
  .ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
        border:1.5px dashed #E6DCC8;border-radius:50%}
  .ring.r1{width:62%;height:62%}
  .ring.r2{width:38%;height:38%;border-style:dotted}
  .oldring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
           border:1.5px dotted #DCCFB6;border-radius:50%;pointer-events:none}
  .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#B9AC95;pointer-events:none}
  .core b{display:block;font-size:19px;letter-spacing:3px;color:#CFC2A8}
  .core span{font-size:8.5px;letter-spacing:1px}

  .cell{position:absolute;width:40px;height:40px;transform:translate(-50%,-50%);
        border-radius:11px;background:#fff;border:2px solid var(--line);
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        font-size:8px;line-height:1.1;cursor:pointer;overflow:hidden;
        transition:transform .12s, box-shadow .12s}
  .cell .nm{font-weight:700;text-align:center;padding:0 1px}
  .cell .lv{font-size:7px;color:var(--gold);height:8px;letter-spacing:-1px}
  /* 功能格：深色底白字，与地块（浅色）形成明确分层 */
  .cell.special{background:#3D3630;color:#F5F0E6;border-color:#2A2420;font-size:9px}
  .cell.locked{background:#F0EBE1;color:#B5A99A;border-style:dashed}
  .cell.broken{background:#F3E7E5;border-color:#D9B8B3;color:#A5797A}
  .cell.owned{box-shadow:inset 0 0 0 3px var(--owner,#ccc)}
  .cell .bar{position:absolute;bottom:0;left:0;right:0;height:4px;background:transparent}
  .cell.jail{background:#4A3A55;border-color:#382C40;color:#F0EAF4}
  .cell.scenic{background:#2F5A46;border-color:#244738;color:#EAF4EE}
  .cell.shop{background:#5A4A2A;border-color:#453719;color:#FBF3DF}

  /* 棋子：国际象棋造型，高度 = 地块图标的 1.5 倍 */
  .token{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);z-index:6;
         display:flex;align-items:center;justify-content:center;pointer-events:none;
         font-size:27px;line-height:1;
         text-shadow:0 1px 0 #fff,0 0 4px rgba(255,255,255,.95),0 2px 4px rgba(0,0,0,.3);
         transition:left .16s ease,top .16s ease}
  .token.active{animation:bob .9s ease-in-out infinite;
         filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
  @keyframes bob{
    0%,100%{transform:translate(-50%,-50%)}
    50%{transform:translate(-50%,calc(-50% - 3px))}
  }

  /* 道具条 */
  #items{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  #items .item{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:0;
    background:#fff;border:2px solid var(--line);border-radius:10px;padding:3px 2px 2px;
    color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--line);line-height:1.15}
  #items .item .ic{font-size:12px;line-height:1}
  #items .item b{font-size:11px;font-variant-numeric:tabular-nums}
  #items .item .nm{font-size:8px;color:var(--ink-soft);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #items .item.off{opacity:.35;box-shadow:none;cursor:not-allowed}
  #items .item:active:not(.off){transform:translateY(2px);box-shadow:0 0 0 var(--line)}

  /* 连片特效 */
  .chainlink{position:absolute;height:3px;border-radius:1.5px;transform-origin:0 50%;
    margin-top:-1.5px;opacity:.26;z-index:4;pointer-events:none}
  .cell.chain{animation:chainPulse 2.2s ease-in-out infinite}
  @keyframes chainPulse{
    0%,100%{box-shadow:inset 0 0 0 3px var(--owner,#ccc)}
    50%{box-shadow:inset 0 0 0 3px var(--owner,#ccc),0 0 9px 1px var(--owner,#ccc)}
  }
  .cell.blocked::after{content:"⛔";position:absolute;right:0;top:-2px;font-size:10px;line-height:1}
  .cell.chain[data-chain]::before{content:attr(data-chain);position:absolute;left:-3px;top:-6px;
    font-size:8px;font-weight:700;line-height:1;padding:1px 3px;border-radius:5px;
    background:var(--owner,#999);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);z-index:3}
  .chainlink::before,.chainlink::after{content:"";position:absolute;top:50%;width:6px;height:6px;
    margin-top:-3px;border-radius:50%;background:inherit}
  .chainlink::before{left:-3px}
  .chainlink::after{right:-3px}

  /* 操作 */
  #bar{display:flex;gap:7px}
  #skill{width:78px;border:2px solid var(--line);border-radius:13px;background:#fff;
    font-size:11px;font-weight:700;color:var(--ink-soft);cursor:pointer;
    box-shadow:0 3px 0 var(--line);line-height:1.2;padding:4px 2px}
  #skill small{display:block;font-size:8.5px;font-weight:400;color:#9A9184}
  #skill.ready{background:#FFF4D6;border-color:var(--gold);color:#7A5C00;box-shadow:0 3px 0 #9E7F14}
  #skill:hover{border-color:var(--gold)}
  #skill.off{opacity:.55;cursor:not-allowed}
  #roll{flex:1;padding:12px;border:none;border-radius:13px;background:var(--teal);color:#fff;
        font-size:16px;font-weight:700;letter-spacing:2px;cursor:pointer;box-shadow:0 3px 0 #1F5A50;
        transition:transform .06s}
  #roll:active{transform:translateY(2px);box-shadow:0 1px 0 #1F5A50}
  #roll:disabled{background:#B9C4C0;box-shadow:0 3px 0 #9AA5A1;cursor:not-allowed}
  #roll small{display:block;font-size:10px;font-weight:400;letter-spacing:0;opacity:.85;margin-top:2px}
  #menu{width:52px;border:2px solid var(--line);border-radius:13px;background:#fff;
        font-size:11px;font-weight:700;color:var(--ink-soft);cursor:pointer;box-shadow:0 3px 0 var(--line)}

  /* 日志 */
  #logWrap{position:relative}
  #log{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px;
       height:200px;overflow-y:auto;font-size:11px;line-height:1.6;box-shadow:0 2px 0 var(--line);
       scroll-behavior:auto}
  #log p.sep{display:flex;align-items:center;gap:6px;color:#B5A99A;font-size:9.5px;
             margin:7px 0 3px;line-height:1.3}
  #log p.sep::before,#log p.sep::after{content:"";flex:1;height:1px;
             background:repeating-linear-gradient(to right,#DDD2BE 0 3px,transparent 3px 6px)}
  #logJump{position:absolute;right:12px;bottom:10px;border:none;border-radius:12px;
           background:rgba(42,36,32,.82);color:#fff;font-size:10px;padding:4px 9px;
           cursor:pointer;display:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  #logJump.show{display:block}
  #log p{margin-bottom:2px;color:var(--ink-soft)}
  #log p b{color:var(--ink)}
  #log p.good{color:var(--green)}
  #log p.bad{color:var(--red)}
  #log p.sys{color:#6B4E9B;font-weight:700}

  /* 大屏：左信息栏、右棋盘，棋盘吸顶 */
  @media (min-width:760px) and (min-height:560px){
    body{padding:14px;align-items:flex-start}
    #app{
      max-width:1040px;
      display:grid;
      grid-template-columns:minmax(300px,370px) minmax(0,1fr);
      grid-template-areas:
        "hud    board"
        "kline  board"
        "items  board"
        "bar    board"
        "log    board"
        "foot   foot";
      gap:9px;align-items:start;
    }
    #hud{grid-area:hud}
    #kline{grid-area:kline}
    #items{grid-area:items}
    #bar{grid-area:bar}
    #logWrap{grid-area:log}
    #foot{grid-area:foot}
    #boardWrap{grid-area:board;position:sticky;top:14px;
               max-width:min(100%,620px);margin-inline:auto}
    #log{height:186px}
    #kchart{height:104px}
    .cell{width:46px;height:46px;font-size:8.5px}
    .cell.special{font-size:9.5px}
  }
  @media (min-width:1180px){
    #app{max-width:1180px;grid-template-columns:minmax(340px,410px) minmax(0,1fr)}
    #boardWrap{max-width:680px}
    #log{height:230px}
    #kchart{height:124px}
    .cell{width:52px;height:52px;font-size:9px}
    .cell.special{font-size:10px}
  }

  /* 弹窗 */
  #modal{position:fixed;inset:0;background:rgba(42,36,32,.55);display:flex;align-items:center;
         justify-content:center;padding:16px;z-index:50}
  #modal.hidden{display:none}
  .sheet{background:#fff;border-radius:18px;padding:16px;width:100%;max-width:360px;
         border:2px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
  .sheet h3{font-size:16px;margin-bottom:4px}
  .sheet .sub{font-size:11px;color:var(--ink-soft);margin-bottom:8px;line-height:1.55}
  .kv{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dashed #EDE5D6}
  .kv:last-of-type{border:none}
  .kv b{font-variant-numeric:tabular-nums}
  .warn{font-size:10.5px;color:var(--red);margin-top:8px;min-height:14px;line-height:1.4}
  .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .btns button{flex:1;min-width:86px;padding:11px;border-radius:11px;border:none;font-size:14px;
               font-weight:700;cursor:pointer;transition:transform .06s}
  .btns button:active{transform:translateY(2px)}
  .btn-main{background:var(--teal);color:#fff;box-shadow:0 3px 0 #1F5A50}
  .btn-sub{background:#EFE9DC;color:var(--ink);box-shadow:0 3px 0 #D8CDBB}
  .btn-gold{background:var(--gold);color:#3A2E00;box-shadow:0 3px 0 #9E7F14}
  .btn-red{background:#C0392B;color:#fff;box-shadow:0 3px 0 #8E2A20}
  .btns button:disabled{background:#D9D2C4;color:#9A9184;box-shadow:0 3px 0 #C4BCAC;cursor:not-allowed}

  /* 开局选择 */
  .pick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
  .pickbtn{background:#FAF7F0;border:2px solid var(--line);border-radius:10px;padding:7px 4px;
           display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:10px}
  .pickbtn b{font-size:12px}
  .pickbtn span{font-size:9px;color:var(--ink-soft)}
  .pickbtn.on{border-color:var(--teal);background:#EAF3F0;box-shadow:0 0 0 2px #2E7D6F22}

  .toast{position:fixed;left:50%;top:12%;transform:translateX(-50%);background:rgba(42,36,32,.92);
         color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:80;opacity:0;
         transition:opacity .25s;pointer-events:none;max-width:82%;text-align:center;line-height:1.45}
  .toast.show{opacity:1}

  .rank-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed #EDE5D6}
  .rank-row b{font-variant-numeric:tabular-nums}
  .medal{font-size:14px;margin-right:4px}

  .ev{display:flex;gap:8px;font-size:11px;padding:4px 0;border-bottom:1px dashed #EDE5D6;line-height:1.45}
  .ev:last-child{border-bottom:none}
  .ev .ev-n{font-weight:700;white-space:nowrap;color:var(--ink);min-width:62px}
  .ev .ev-d{color:#6B6156}

  #tip{position:fixed;left:8px;right:8px;top:0;z-index:9999;background:#2A2420;color:#fff;
       font-size:11.5px;line-height:1.55;padding:10px 12px;border-radius:11px;
       box-shadow:0 8px 22px rgba(0,0,0,.3);pointer-events:none;opacity:0;transition:opacity .12s}
  #tip.show{opacity:1}
  #tip b{display:block;font-size:12.5px;margin-bottom:2px}
  #tip .t-meta{color:#C9BFAE;font-size:10.5px;margin-bottom:5px}
  #tip div{white-space:normal}

  #foot{text-align:center;font-size:10px;color:#9A9184;line-height:1.6;padding:2px 0 6px}
  #foot a{color:#9A9184;text-decoration:none;border-bottom:1px dotted #C4BCAC;margin:0 3px}

  /* ==========================================================
     V2 视觉主题：F1 式硬朗深色 + 各区块拟物
     区块对应：HUD 档案袋 / 玩家卡文件夹 / 证券炒股软件 /
     棋盘围棋盘 / 道具与操作手机 / 掷骰聚宝盆 / 菜单字典 / 日志账单
     ========================================================== */
  :root{
    --paper:#0A0B0D; --ink:#F2F4F7; --ink-soft:#98A0A8;
    --line:#2A2E35; --panel:#14161B; --panel-2:#1B1E24;
    --teal:#00C2A8; --gold:#E8B23A;
    --red:#E10600; --green:#12B76A;
    --kraft:#241F19; --kraft-line:#3A3229;
    --magnet:#0F1114;
  }
  body{
    background:
      linear-gradient(rgba(6,7,9,.52), rgba(6,7,9,.80)),
      url("assets/hangzhou-satellite.jpg") center/cover no-repeat fixed;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{gap:8px}

  /* ---------- 档案袋：HUD ---------- */
  #hud{
    position:relative;
    background:linear-gradient(168deg,#2A241C 0%,#1F1A15 45%,#191510 100%);
    border:1px solid var(--kraft-line);
    border-top:3px solid var(--red);
    border-radius:4px 10px 10px 10px;
    box-shadow:0 6px 0 rgba(0,0,0,.55), 0 12px 26px rgba(0,0,0,.45),
               inset 0 1px 0 rgba(255,255,255,.05);
    padding:10px 12px 9px 18px;
  }
  /* 装订孔 */
  #hud::before{
    content:""; position:absolute; left:5px; top:12px; bottom:12px; width:5px;
    background:radial-gradient(circle, #0A0B0D 1.6px, transparent 1.8px) 0 0/5px 14px repeat-y;
    opacity:.85;
  }
  /* 封条 */
  #hud::after{
    content:"ARCHIVE · HZ 2010—2026"; position:absolute; right:10px; top:-3px;
    font-size:7.5px; letter-spacing:1.4px; color:#F6D9D7;
    background:var(--red); padding:2px 7px 1px; border-radius:0 0 3px 3px;
    font-weight:700;
  }
  #date{font-size:17px;letter-spacing:.4px;font-weight:800}
  #chapter{color:#B9AE9C;font-size:9.5px}
  .badge{background:#3A3229;color:#D9CDB8;border:1px solid #4A4034}
  #turnInfo{color:#B9AE9C}
  #bar-progress{background:#0D0B08;box-shadow:inset 0 1px 2px rgba(0,0,0,.8)}
  #bar-fill{background:linear-gradient(90deg,#E10600,#FF5A3C)}

  /* ---------- 文件夹：玩家卡 ---------- */
  .players{gap:6px}
  .pcard{
    position:relative;
    background:linear-gradient(180deg,#232019,#1A1712);
    border:1px solid var(--kraft-line);
    border-left:3px solid var(--line);
    border-radius:3px 7px 7px 3px;
    padding:5px 7px 5px 9px;
    box-shadow:0 2px 0 rgba(0,0,0,.5);
  }
  /* 文件夹标签 */
  .pcard::after{
    content:""; position:absolute; right:6px; top:-1px; width:26px; height:4px;
    background:#3A3229; border-radius:0 0 2px 2px;
  }
  .pcard.active{border-color:var(--gold);border-left-color:var(--gold);
                background:linear-gradient(180deg,#2C2718,#201C12);
                box-shadow:0 0 0 1px rgba(232,178,58,.35), 0 2px 0 rgba(0,0,0,.5)}
  .pcard.dead{opacity:.4;filter:grayscale(.6)}
  .pname{color:#EDE6D8}
  .prank{background:#3A3229;color:#B9AE9C}
  .prank.r1{background:var(--gold);color:#241F19}
  .prank.r2{background:#C7CBD1;color:#1A1C20}
  .prank.r3{background:#C08A5A;color:#241F19}
  .pkv i{color:#8E8578}
  .pkv b{color:#F2ECDF}
  .pkv b.neg{color:#FF6B5E}
  .pkv b.muted{color:#6B6357}

  /* ---------- 炒股软件：证券栏 ---------- */
  #kline{
    background:linear-gradient(180deg,#0C0E10,#08090B);
    border:1px solid #262A30;
    border-radius:3px;
    box-shadow:0 6px 0 rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
    padding:0 0 7px;
    position:relative;
  }
  .k-head{
    padding:5px 9px 4px; margin-bottom:2px;
    background:linear-gradient(180deg,#171A1E,#101215);
    border-bottom:1px solid #262A30;
    border-radius:3px 3px 0 0;
  }
  .k-name{color:#7F8994;font-size:9px;letter-spacing:.6px}
  .k-price{color:#F2F4F7;font-family:ui-monospace,"SF Mono",Consolas,monospace;letter-spacing:.5px}
  .k-chg{font-family:ui-monospace,"SF Mono",Consolas,monospace}
  .k-chg.up{color:#FF4D3D}
  .k-chg.down{color:#12D68A}
  #kchart{margin-top:0;background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 18px);
  }
  .k-foot{padding:3px 9px 0;color:#7F8994;font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:9px}
  .k-foot .up{color:#FF4D3D}
  .k-foot .down{color:#12D68A}

  /* ---------- 围棋盘：棋盘 ---------- */
  #boardWrap{
    background:
      repeating-linear-gradient(0deg, rgba(56,34,12,.42) 0 1px, transparent 1px 10%),
      repeating-linear-gradient(90deg, rgba(56,34,12,.42) 0 1px, transparent 1px 10%),
      radial-gradient(circle at 50% 50%, rgba(60,38,16,.22) 0 2.5px, transparent 3px),
      linear-gradient(152deg,#D8B27C 0%,#C79A5C 52%,#AC7F45 100%);
    border:3px solid #3A2A18;
    border-radius:10px;
    box-shadow:0 8px 0 rgba(0,0,0,.55), 0 16px 34px rgba(0,0,0,.5),
               inset 0 0 0 2px rgba(255,240,210,.18), inset 0 0 40px rgba(90,55,20,.25);
  }
  /* 地铁线网底图：随章节切换 */
  #boardWrap::before{
    content:""; position:absolute; inset:0; z-index:0;
    background-image:var(--metro,none);
    background-size:104%; background-position:center; background-repeat:no-repeat;
    opacity:.22; pointer-events:none;
    filter:saturate(.85);
  }
  .ring{border-color:rgba(70,45,20,.22)}
  .core b{color:rgba(70,45,20,.55);text-shadow:0 1px 0 rgba(255,245,220,.4)}
  .core span{color:rgba(70,45,20,.45)}

  /* 格子：地块浅色卡片 + 建筑图标 */
  .cell{
    border:1.5px solid rgba(70,45,20,.55);
    background:linear-gradient(180deg,#FFFDF8,#F1E7D6);
    color:#2A2016;
    box-shadow:0 2px 0 rgba(60,38,16,.4), 0 3px 8px rgba(0,0,0,.3);
    display:block;padding:0;overflow:hidden;
    border-radius:9px;
  }
  /* 建筑图标铺满格子，名字压在底部色条上 */
  .cell .bld{
    position:absolute;left:0;right:0;top:0;bottom:9px;
    background-size:86%;background-repeat:no-repeat;background-position:center bottom;
    z-index:1;
  }
  .cell .bld[data-lv="0"]{background-image:var(--bld0)}
  .cell .bld[data-lv="1"]{background-image:var(--bld1)}
  .cell .bld[data-lv="2"]{background-image:var(--bld2)}
  .cell .bld[data-lv="3"]{background-image:var(--bld3)}
  .cell .bld[data-lv="4"]{background-image:var(--bld4)}
  .cell .bld[data-lv="5"]{background-image:var(--bld5)}
  .cell .nm{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    font-size:6.6px;line-height:1;letter-spacing:-.2px;padding:1.5px 0 1px;
    text-align:center;background:rgba(255,252,245,.9);
    border-top:1px solid rgba(70,45,20,.18);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .cell .lv{display:none}
  .cell.special{
    background:linear-gradient(160deg,#2B2F36,#1D2126);
    color:#E9EDF2;border-color:#0F1114;
    font-size:8px;letter-spacing:.3px;
    box-shadow:0 2px 0 rgba(0,0,0,.6), 0 3px 8px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;
  }
  /* 功能格没有建筑图标，文字直接居中 */
  .cell.special .nm{
    position:static;background:none;border:none;padding:0;color:inherit;
    font-size:8px;line-height:1.1;letter-spacing:.3px;
  }
  .cell.jail{background:linear-gradient(160deg,#4A3A55,#2E2436);color:#F0EAF4}
  .cell.scenic{background:linear-gradient(160deg,#2F5A46,#1D3A2C);color:#EAF4EE}
  .cell.shop{background:linear-gradient(160deg,#6E5420,#43300F);color:#FBF3DF}
  .cell.locked{background:rgba(255,250,240,.45);color:#8A7A62;border-style:dashed}
  .cell.broken{background:#B98E86;color:#3A1A16}
  .cell.owned{box-shadow:0 2px 0 rgba(60,38,16,.4), 0 3px 8px rgba(0,0,0,.3)}
  .cell.owned .nm{background:var(--owner);color:#fff;border-top-color:rgba(0,0,0,.25)}
  .cell.chain{animation:chainPulse 2.2s ease-in-out infinite}

  /* ---------- 手机：道具条 + 操作栏 ---------- */
  #items{
    background:linear-gradient(180deg,#1C2027,#12151A);
    border:2px solid #2E343C;
    border-bottom:none;
    border-radius:20px 20px 0 0;
    padding:9px 8px 6px;
    position:relative;
    box-shadow:0 -2px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
  }
  /* 刘海 */
  #items::before{
    content:""; position:absolute; left:50%; top:3px; transform:translateX(-50%);
    width:56px; height:5px; border-radius:3px; background:#08090B;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.9);
  }
  #items .item{
    background:linear-gradient(180deg,#2A3038,#1C2127);
    border:1px solid #3A414A;border-radius:11px;
    box-shadow:0 2px 0 rgba(0,0,0,.5);
    color:#E9EDF2;
  }
  #items .item .nm{color:#8E97A2}
  #items .item.off{opacity:.3;box-shadow:none}
  #bar{
    background:linear-gradient(180deg,#12151A,#0C0E11);
    border:2px solid #2E343C;border-top:none;
    border-radius:0 0 20px 20px;
    padding:7px 8px 12px;
    position:relative;
    box-shadow:0 6px 0 rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.04);
  }
  /* Home 条 */
  #bar::after{
    content:""; position:absolute; left:50%; bottom:5px; transform:translateX(-50%);
    width:72px; height:3.5px; border-radius:2px; background:#3A414A;
  }

  /* ---------- 聚宝盆：掷骰 ---------- */
  #roll{
    background:radial-gradient(120% 130% at 50% 0%, #F6D06B 0%, #E0A22B 42%, #A9701A 100%);
    color:#2A1B02;
    border:2px solid #6B4708;
    border-radius:14px;
    box-shadow:0 5px 0 #6B4708, inset 0 2px 0 rgba(255,255,255,.55),
               inset 0 -6px 12px rgba(120,70,0,.35);
    text-shadow:0 1px 0 rgba(255,255,255,.5);
    position:relative;
  }
  #roll small{color:#6B4708;opacity:.9}
  #roll:active{transform:translateY(3px);box-shadow:0 2px 0 #6B4708, inset 0 2px 0 rgba(255,255,255,.5)}
  #roll:disabled{background:linear-gradient(180deg,#3A3F46,#282C32);color:#8E97A2;
    box-shadow:0 5px 0 #14171B;text-shadow:none;border-color:#14171B}

  /* ---------- 字典：菜单 ---------- */
  #menu{
    background:linear-gradient(90deg,#5A3A2A 0 7px,#7B4E34 7px,#6B4429 100%);
    color:#F3E3CC;
    border:1px solid #3A2418;
    border-radius:3px 9px 9px 3px;
    box-shadow:0 5px 0 #2A1A10, inset 0 1px 0 rgba(255,255,255,.15);
    font-size:11px;
  }
  #skill{
    background:linear-gradient(180deg,#262B33,#171A1F);
    border:1px solid #3A414A;color:#C9D2DC;
    box-shadow:0 3px 0 rgba(0,0,0,.5);
  }
  #skill small{color:#7F8994}
  #skill.ready{
    background:linear-gradient(180deg,#3A2E12,#241C0A);
    border-color:var(--gold);color:#F6D98B;
    box-shadow:0 3px 0 #6B4E08, 0 0 12px rgba(232,178,58,.35);
  }
  #skill.off{opacity:.5}

  /* ---------- 账单：日志 ---------- */
  #log{
    background:
      repeating-linear-gradient(0deg, transparent 0 21px, rgba(90,70,40,.14) 21px 22px),
      linear-gradient(180deg,#EDE6D6,#E2D9C6);
    color:#3A2E20;
    border:1px solid #B8A98C;
    border-radius:2px;
    box-shadow:0 6px 0 rgba(0,0,0,.5), inset 0 2px 8px rgba(120,95,55,.18);
  }
  #log p{color:#5C4E3C}
  #log p b{color:#2A2016}
  #log p.good{color:#1B6B3A}
  #log p.bad{color:#A3231A}
  #log p.sys{color:#5A3E8C}
  #log p.sep{color:#9A8A6E}
  #log p.sep::before,#log p.sep::after{
    background:repeating-linear-gradient(to right,#B8A98C 0 3px,transparent 3px 6px)}
  #logJump{background:rgba(40,32,22,.85);color:#EDE6D6}

  /* ---------- 磁吸块：各区块底部统一 ---------- */
  #hud, #kline, #items, #bar, #logWrap, #boardWrap, #policy, #legacy{
    position:relative;
  }
  #policy .chip, #legacy .chip{
    background:linear-gradient(180deg,#2A2E36,#1C2026);
    color:#D5DCE4;border:1px solid #3A414A;
    border-radius:4px;
    box-shadow:0 2px 0 rgba(0,0,0,.5);
    font-weight:600;letter-spacing:.2px;
  }
  #policy .chip.info{background:linear-gradient(180deg,#1E3A34,#12241F);color:#7FE3CB;border-color:#2A554A}
  #legacy .chip.legacy{background:linear-gradient(180deg,#2A241C,#1A1610);color:#C9B99A;border-color:#3A3229}
  #legacy .chip.legacy.empty{opacity:.55}

  #foot{color:#6E7680}
  #foot a{color:#8E97A2;border-bottom-color:#3A414A}
  .sheet{background:#15171C;border:1px solid #2E343C;color:#E9EDF2}
  .sheet h3{color:#F2F4F7}
  .sheet .sub{color:#98A0A8}
  .kv{border-bottom-color:#262A30}
  .kv b{color:#F2F4F7}
  .btn-sub{background:#262B33;color:#D5DCE4;box-shadow:0 3px 0 #12151A}
  .btn-main{background:var(--red);color:#fff;box-shadow:0 3px 0 #8A0400}
  .btn-gold{background:var(--gold);color:#2A1B02;box-shadow:0 3px 0 #8A6A0E}
  .pickbtn{background:#1B1E24;border-color:#2E343C;color:#D5DCE4}
  .pickbtn span{color:#8E97A2}
  .pickbtn.on{border-color:var(--teal);background:#12302B}
  #tip{background:#050608;border:1px solid #2E343C;color:#E9EDF2}
  #tip .t-meta{color:#8E97A2}
  .toast{background:rgba(10,11,13,.95);border:1px solid #2E343C;color:#F2F4F7}

  /* 桌面端格子放大，图标同步 */
  @media (min-width:760px) and (min-height:560px){
    .cell{width:44px;height:44px}
    #boardWrap .bld{width:30px;height:30px}
    .cell .nm{font-size:7.5px}
    .cell.special{font-size:8.5px}
  }
  @media (min-width:1180px){
    .cell{width:50px;height:50px}
    #boardWrap .bld{width:34px;height:34px}
    .cell .nm{font-size:8px}
    .cell.special{font-size:9px}
  }


  /* ==========================================================
     V3 浅色版：棋盘保留木色，其余区块统一浅色（覆盖 V2 配色）
     ========================================================== */
  :root{
    --paper:#EFEDE7; --ink:#2A2420; --ink-soft:#6B6156;
    --line:#D9D2C4; --panel:#FCFBF8; --panel-2:#F4F1EA;
    --red:#D32F2F; --green:#1B7A3E; --gold:#C9A227;
    --kraft:#E7D9BF; --kraft-line:#CBB99A;
  }
  body{
    background:
      linear-gradient(rgba(240,238,232,.86), rgba(234,231,223,.93)),
      url("assets/hangzhou-satellite.jpg") center/cover no-repeat fixed;
    color:var(--ink);
  }

  /* 档案袋：浅牛皮纸 */
  #hud{
    background:linear-gradient(168deg,#F6ECD8 0%,#EDE0C6 48%,#E4D5B7 100%);
    border:1px solid var(--kraft-line);
    border-top:3px solid var(--red);
    box-shadow:0 4px 0 #C9B99A, 0 9px 20px rgba(90,70,40,.16),
               inset 0 1px 0 rgba(255,255,255,.7);

  #hud::before{
    background:radial-gradient(circle,#C3B295 1.6px,transparent 1.8px) 0 0/5px 14px repeat-y;
  }
  #date{color:#2A2420}
  #chapter{color:#7A6A52}
  .badge{background:#E2D4B6;color:#5A4A32;border:1px solid #CBB99A}
  #turnInfo{color:#7A6A52}
  #bar-progress{background:#D9CAAD;box-shadow:inset 0 1px 2px rgba(120,95,55,.35)}
  #bar-fill{background:linear-gradient(90deg,#D32F2F,#E8663F)}

  /* 文件夹：浅米 */
  .pcard{
    background:linear-gradient(180deg,#FDFBF5,#F5EFE2);
    border:1px solid #DDD3BF;
    border-left:3px solid var(--line);
    box-shadow:0 2px 0 rgba(120,100,70,.18);
  }
  .pcard::after{background:#DDD3BF}
  .pcard.active{
    border-color:var(--gold);
    background:linear-gradient(180deg,#FFFAEA,#FBF2D8);
    box-shadow:0 0 0 1px rgba(201,162,39,.45), 0 2px 0 rgba(120,100,70,.18);
  }
  .pcard.dead{opacity:.45;filter:grayscale(.5)}
  .pname{color:#2A2420}
  .prank{background:#E5DBC7;color:#6B6156}

  .prank.r2{background:#D6D9DE;color:#3A3F46}
  .prank.r3{background:#D9A97A;color:#4A2A10}
  .pkv i{color:#8A7D68}
  .pkv b{color:#2A2420}
  .pkv b.neg{color:#C0392B}
  .pkv b.muted{color:#A89C88}

  /* 炒股软件：浅灰终端 */
  #kline{
    background:linear-gradient(180deg,#FDFDFE,#F2F3F6);
    border:1px solid #DDDFE5;
    box-shadow:0 4px 0 #D9D2C4, inset 0 1px 0 #fff;
  }
  .k-head{
    background:linear-gradient(180deg,#F2F3F6,#E8EAEF);
    border-bottom:1px solid #DDDFE5;
  }
  .k-name{color:#6B7280}
  .k-price{color:#1A1C20}
  .k-chg.up{color:#D93B30}
  .k-chg.down{color:#1B9E5A}
  #kchart{background:
    repeating-linear-gradient(0deg, rgba(40,36,32,.05) 0 1px, transparent 1px 18px);
  }
  .k-foot{color:#6B7280}
  .k-foot .up{color:#D93B30}
  .k-foot .down{color:#1B9E5A}

  /* 手机：浅银机身 */
  #items{
    background:linear-gradient(180deg,#F9FAFC,#EDEFF3);
    border:2px solid #D5D8DE;border-bottom:none;
    box-shadow:0 -2px 0 rgba(120,110,90,.14), inset 0 1px 0 #fff;
  }
  #items::before{background:#C6CBD3;box-shadow:inset 0 1px 2px rgba(0,0,0,.28)}
  #items .item{
    background:linear-gradient(180deg,#FFFFFF,#F0F2F6);
    border:1px solid #D9DCE2;color:#2A2420;
    box-shadow:0 2px 0 rgba(120,110,90,.16);
  }
  #items .item .nm{color:#6B6156}
  #bar{
    background:linear-gradient(180deg,#EDEFF3,#E2E5EA);
    border:2px solid #D5D8DE;border-top:none;
    box-shadow:0 4px 0 #C6BFB0, inset 0 -1px 0 rgba(255,255,255,.6);
  }
  #bar::after{background:#C6CBD3}

  /* 字典：保留深棕书脊做点缀 */
  #menu{
    background:linear-gradient(90deg,#6B4429 0 7px,#8A5A3A 7px,#7A4E30 100%);
    color:#FBF1E2;
    border:1px solid #4A2E1C;
    box-shadow:0 4px 0 #3A2418, inset 0 1px 0 rgba(255,255,255,.22);
  }
  #skill{
    background:linear-gradient(180deg,#FFFFFF,#F0F2F6);
    border:1px solid #D9DCE2;color:#4A4238;
    box-shadow:0 3px 0 rgba(120,110,90,.2);
  }
  #skill small{color:#8A7D68}
  #skill.ready{
    background:linear-gradient(180deg,#FFF6DC,#FBEBC2);
    border-color:var(--gold);color:#7A5C00;
    box-shadow:0 3px 0 #C9A227, 0 0 10px rgba(201,162,39,.3);

  #policy .chip{
    background:linear-gradient(180deg,#FFFFFF,#F1EDE4);
    color:#4A4238;border:1px solid #D9D2C4;
    box-shadow:0 2px 0 rgba(120,100,70,.18);
  }
  #policy .chip.info{background:#E9F4EF;color:#2E7D6F;border-color:#BFD9CC}
  #legacy .chip.legacy{background:#F1EADB;color:#6B6156;border-color:#D9D2C4}

  /* 格子：只放名字，居中放大 */

    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#FFFDF8,#F2E9D8);

    box-shadow:0 2px 0 rgba(60,38,16,.3), 0 3px 7px rgba(0,0,0,.22);

    position:static;background:none;border:none;padding:0 1px;

  .sheet .sub{color:#6B6156}

  .btn-gold{background:var(--gold);color:#3A2E00;box-shadow:0 3px 0 #9E7F14}

  /* ==========================================================
     V4：方形棋盘（24 格外圈 + 中心监狱 + 外圈建筑带）
     9×9 网格：row1/row9/col1/col9 是建筑带，格子占外圈一圈，
     正中心 5×5 空出来放监狱。
     ========================================================== */
  #boardWrap{
    display:grid;
    grid-template-columns:repeat(9,minmax(0,1fr));
    grid-template-rows:repeat(9,minmax(0,1fr));
    padding:0;gap:0;
  }
  #boardWrap .cell{
    position:relative;z-index:2;
    width:auto;height:auto;transform:none;
    grid-column:var(--c);grid-row:var(--r);
    margin:3px;padding:0 1px;
    display:flex;align-items:center;justify-content:center;
    border:2px solid #2A2420;border-radius:7px;
    background:linear-gradient(180deg,#FFFDF8,#F1E7D6);
    color:#2A2016;
    box-shadow:0 2px 0 rgba(60,38,16,.32);
    font-size:8px;line-height:1.06;
    cursor:pointer;overflow:hidden;
  }
  #boardWrap .cell .nm{
    position:static;background:none;border:none;padding:0;margin:0;
    font-size:8px;font-weight:700;line-height:1.06;letter-spacing:-.2px;
    text-align:center;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  /* 功能格：深色底白字，黑框不变 */
  #boardWrap .cell.special{
    background:linear-gradient(160deg,#33383F,#20242A);
    color:#E9EDF2;border-color:#15181C;
  }
  #boardWrap .cell.special .nm{font-size:8.5px;letter-spacing:0}
  #boardWrap .cell.shop{background:linear-gradient(160deg,#6E5420,#43300F);color:#FBF3DF}
  #boardWrap .cell.scenic{background:linear-gradient(160deg,#2F5A46,#1D3A2C);color:#EAF4EE}
  #boardWrap .cell.locked{background:linear-gradient(180deg,#F6F1E7,#E9E1D2);color:#A2937C;border-style:dashed}
  #boardWrap .cell.broken{background:linear-gradient(180deg,#F0E0DC,#DCC4BE);color:#8A5A52}
  /* 已购：黑框常驻，框内加一圈玩家色，房子画在外侧槽位里 */
  #boardWrap .cell.owned{
    background:linear-gradient(180deg,#FFFDF8,#F6EEDF);
    box-shadow:inset 0 0 0 2px var(--owner-soft,#9996), 0 2px 0 rgba(60,38,16,.32);
  }
  #boardWrap .cell.owned .nm{color:#3A2E1E}
  #boardWrap .cell.owned .nm{color:#2A2016}
  #boardWrap .cell .bar{display:none}
  /* 监狱：棋盘正中心 */
  #boardWrap .cell.jailcell{
    background:linear-gradient(160deg,#5B4370,#3A2B4A);
    color:#F0EAF4;border-color:#2A1F36;
    box-shadow:0 3px 0 #2A1F36, 0 0 16px rgba(91,67,112,.4);
  }
  #boardWrap .cell.jailcell .nm{font-size:9px;letter-spacing:1.5px}

  /* 建筑槽：地块外侧紧邻的一格，常驻；空地是虚线空框 */
  #boardWrap .bslot{
    grid-column:var(--c);grid-row:var(--r);
    margin:5px;border-radius:7px;
    display:flex;align-items:flex-end;justify-content:center;
    border:1.5px dashed rgba(90,60,30,.28);
    background:rgba(255,252,244,.26);
    overflow:visible;z-index:1;
  }
  #boardWrap .bslot.empty::after{
    content:"";width:56%;height:34%;margin-bottom:16%;
    border:1.5px dashed rgba(90,60,30,.22);border-radius:3px;
  }
  #boardWrap .bslot:not(.empty){border-color:transparent;background:transparent}
  #boardWrap .bslot .bld{
    position:static;width:100%;height:100%;transform:none;
    background-size:contain;background-repeat:no-repeat;
    background-position:center bottom;
    filter:drop-shadow(0 2px 2px rgba(70,45,20,.38));
  }
  #boardWrap .bslot .bld[data-lv="1"]{background-image:var(--bld1)}
  #boardWrap .bslot .bld[data-lv="2"]{background-image:var(--bld2)}
  #boardWrap .bslot .bld[data-lv="3"]{background-image:var(--bld3)}
  #boardWrap .bslot .bld[data-lv="4"]{background-image:var(--bld4)}
  #boardWrap .bslot .bld[data-lv="5"]{background-image:var(--bld5)}

  /* 监狱 ↔ 证券格的双线 */
  #boardWrap .jailwire{
    position:absolute;left:50%;top:calc(100% * 5.5 / 9);height:calc(100% * 2.5 / 9);
    width:18px;transform:translateX(-50%);
    z-index:0;pointer-events:none;
  }
  #boardWrap .jailwire::before,#boardWrap .jailwire::after{
    content:"";position:absolute;top:0;bottom:0;width:2.5px;border-radius:2px;
    background:rgba(58,42,24,.5);
  }
  #boardWrap .jailwire::before{left:3px}
  #boardWrap .jailwire::after{right:3px}

  /* 连片带画在格子下层，只从缝隙里露出来 */
  #boardWrap .chainlink{
    position:absolute;height:4px;border-radius:2px;
    transform-origin:0 50%;margin-top:-2px;
    opacity:.55;z-index:1;pointer-events:none;
  }
  #boardWrap .token{z-index:8}
  /* 连片：格子描边呼吸 + 右上角 ×2 角标 */
  #boardWrap .cell.chain{
    box-shadow:inset 0 0 0 2px var(--owner,#999), 0 2px 0 rgba(60,38,16,.32);
  }
  #boardWrap .cell.chain::after{
    content:attr(data-chain);position:absolute;top:1px;right:2px;
    font-size:6px;font-weight:800;color:var(--owner,#999);
    letter-spacing:0;line-height:1;
  }
  /* 圆形辅助线是圆环棋盘的产物，方形布局下只会干扰 */
  #boardWrap .ring{display:none}
  /* 章节名上移到监狱上方，正中心留给监狱 */
  #boardWrap .core{
    top:30%;z-index:1;pointer-events:none;
  }
  #boardWrap .core b{font-size:15px;letter-spacing:5px;color:rgba(70,45,20,.34)}
  #boardWrap .core span{font-size:8px;letter-spacing:1.6px;color:rgba(70,45,20,.3)}

</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-top">
      <div>
        <div id="date">2010 年 1 月</div>
        <div id="chapter">第一章 · 限购前夜　<span class="badge">2010 — 2013</span></div>
      </div>
      <div id="turnInfo">第 1 / 48 月</div>
    </div>
    <div id="bar-progress"><div id="bar-fill"></div></div>
    <div class="players" id="players"></div>
    <div id="policy"></div>
    <div id="legacy"></div>
  </header>

  <section id="kline">
    <div class="k-head">
      <span class="k-name">杭州楼市指数</span>
      <span class="k-price" id="k-price">1,000</span>
      <span class="k-chg" id="k-chg">—</span>
    </div>
    <canvas id="kchart"></canvas>
    <div class="k-foot">
      <span id="k-hold">持仓 0 手</span>
      <span id="k-value">市值 0 万</span>
      <span id="k-pnl">盈亏 —</span>
    </div>
  </section>

  <div id="boardWrap">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="core"><b>杭州</b><span>2010 — 2026</span></div>
  </div>

  <div id="items"></div>

  <div id="bar">
    <button id="skill" style="display:none">技能</button>
    <button id="roll">选择角色开始</button>
    <button id="menu">菜单</button>
  </div>

  <div id="logWrap">
    <div id="log"></div>
    <button id="logJump">↓ 最新</button>
  </div>

  <footer id="foot">
    <a href="./privacy.html">隐私政策</a>·<a href="./terms.html">用户协议</a><br>
    虚构作品，数值均为游戏设定，不构成任何投资建议
  </footer>
</div>

<div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div id="tip"></div>

<script src="data.js?v=1.8.0"></script>
<script src="game.js?v=1.8.0"></script>
</body>
